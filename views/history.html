<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History - Prompt2Profit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/history.css" />
 
  </head>
  <body>
    <!-- Mobile Menu Overlay -->
    <div class="mobile-overlay" id="mobileOverlay"></div>
    
    <div class="container">
      <!-- Header Navigation -->
      <header class="header">
        <div class="logo">
          <div class="logo-icon">
            <i class="fas fa-shield-alt"></i>
          </div>
          <span class="logo-text">Prompt2Profit</span>
        </div>
        
        <!-- Hamburger Menu Button -->
        <button class="hamburger-menu" id="hamburgerMenu" aria-label="Toggle menu">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </header>

      <!-- Mobile Navigation Menu -->
      <nav class="mobile-nav-menu" id="mobileNavMenu">
        <div class="nav-header">
          <span id="welcomeUser">Welcome Guest</span>
          <button class="close-menu" id="closeMenu">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="nav-items">
          <a href="index.html" class="nav-item">
            <i class="fas fa-chart-line"></i>
            <span>Dashboard</span>
          </a>
          <a href="history.html" class="nav-item">
            <i class="fas fa-history"></i>
            <span>History</span>
          </a>
          <a href="index.html" class="nav-item">
            <i class="fas fa-plus-circle"></i>
            <span>New Analysis</span>
          </a>
        </div>
        <div class="nav-footer">
          <button onclick="logout()" id="logout" class="auth-btn" style="display:none;">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
          </button>
          <a href="login.html" id="login-nav" class="auth-btn">
            <i class="fas fa-sign-in-alt"></i>
            <span>Login</span>
          </a>
        </div>
      </nav>

    <div class="main-content">
      <div class="filters">
        <h2>Your Prompts <span id="totalCount">0 total</span></h2>
        <div class="dropdowns">
          <select id="filterType">
            <option value="all">All Prompts</option>
            <option value="treasure">Treasure Only</option>
            <option value="trash">Trash Only</option>
          </select>
          <select id="sortBy">
            <option value="date">Sort by Date</option>
            <option value="score">Sort by Score</option>
            <option value="title">Sort by Title</option>
          </select>
        </div>
      </div>
      <div class="prompt-list" id="promptList">
        <div class="loading">
          <i
            class="fas fa-spinner fa-spin"
            style="font-size: 2rem; margin-bottom: 1rem"
          ></i>
          <p>Loading your prompts...</p>
        </div>
      </div>

      <div class="pagination" id="pagination" style="display: none">
        <button onclick="changePage(-1)">Previous</button>
        <button class="active">1</button>
        <button onclick="changePage(1)">Next</button>
      </div>
    </div>

    <script>
      let currentPage = 1;
      let totalPages = 1;
      let allPrompts = [];
      let filteredPrompts = [];

      // Logout function
      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        localStorage.removeItem("aiResult");
        localStorage.removeItem("topic");
        window.location.href = "/index.html";
      }

      // Initialize page
      document.addEventListener("DOMContentLoaded", async () => {
        handleUserAuthentication();
        await loadUserHistory();
        setupEventListeners();
      });

      function handleUserAuthentication() {
        const user = JSON.parse(localStorage.getItem("user"));
        const welcomeElement = document.getElementById("welcomeUser");

        if (user && user.name) {
          welcomeElement.textContent = `Welcome ${user.name}`;
          document.getElementById("logout").style.display = "inline";
          document.getElementById("login-nav").style.display = "none";
        } else {
          welcomeElement.textContent = "Welcome Guest";
          document.getElementById("logout").style.display = "none";
          document.getElementById("login-nav").style.display = "inline";
        }
      }

      async function loadUserHistory() {
        const historyList = document.getElementById("promptList");

        try {
          const user = JSON.parse(localStorage.getItem("user"));
          const token = localStorage.getItem("token");

          // Build API URL with user ID if available
          let apiUrl = "/api/history";
          if (user && user.id) {
            apiUrl += `?userId=${user.id}`;
          }

          const response = await fetch(apiUrl, {
            method: "GET",
            headers: {
              "Content-Type": "application/json",
              ...(token && { Authorization: `Bearer ${token}` }),
            },
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const history = await response.json();
          console.log("Fetched history data:", history);

          allPrompts = Array.isArray(history) ? history : [];

          if (allPrompts.length === 0) {
            showEmptyState();
            return;
          }

          // Update total count
          document.getElementById(
            "totalCount"
          ).textContent = `${allPrompts.length} total`;

          // Initial filter and display
          applyFiltersAndSort();
        } catch (error) {
          console.error("Error fetching history:", error);
          showErrorState();
        }
      }

      function showEmptyState() {
        const historyList = document.getElementById("promptList");
        historyList.innerHTML = `
          <div class="empty-state">
            <i class="icon fas fa-rocket"></i>
            <h3>Ready to Launch Your Next Big Idea?</h3>
            <p>Your entrepreneurial journey starts here! Transform your creative sparks into comprehensive business strategies with AI-powered insights and professional roadmaps.</p>
            <a href="/index.html" class="create-btn">
              <i class="fas fa-plus-circle"></i> Create Your First Business Idea
            </a>
          </div>
        `;
      }

      function showErrorState() {
        const historyList = document.getElementById("promptList");
        historyList.innerHTML = `
          <div class="error-state">
            <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 1rem;"></i>
            <h3>Error Loading History</h3>
            <p>We couldn't load your prompt history. Please try again.</p>
            <button class="retry-btn" onclick="loadUserHistory()">
              <i class="fas fa-refresh"></i> Retry
            </button>
          </div>
        `;
      }

      function applyFiltersAndSort() {
        const filterType = document.getElementById("filterType").value;
        const sortBy = document.getElementById("sortBy").value;

        // Apply filters
        filteredPrompts = allPrompts.filter((item) => {
          if (filterType === "all") return true;
          if (filterType === "treasure")
            return item.worthbuilding === "Treasure";
          if (filterType === "trash") return item.worthbuilding === "Trash";
          return true;
        });

        // Apply sorting
        filteredPrompts.sort((a, b) => {
          switch (sortBy) {
            case "date":
              return new Date(b.createdAt) - new Date(a.createdAt);
            case "score":
              const scoreA = parseInt(a.score) || 0;
              const scoreB = parseInt(b.score) || 0;
              return scoreB - scoreA;
            case "title":
              const titleA = a.prompt_desc || a.promptText || "";
              const titleB = b.prompt_desc || b.promptText || "";
              return titleA.localeCompare(titleB);
            default:
              return 0;
          }
        });

        // Update count
        document.getElementById(
          "totalCount"
        ).textContent = `${filteredPrompts.length} total`;

        // Reset pagination
        currentPage = 1;
        displayPrompts();
      }

      function displayPrompts() {
        const historyList = document.getElementById("promptList");
        const itemsPerPage = 10;
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const currentPrompts = filteredPrompts.slice(startIndex, endIndex);

        if (currentPrompts.length === 0) {
          showEmptyState();
          return;
        }

        historyList.innerHTML = "";

        currentPrompts.forEach((item, idx) => {
          const title =
            item.prompt_desc || item.promptText || "Untitled Prompt";
          const worth = item.worthbuilding || "Unknown";
          const score = item.score || "N/A";
          const created = item.createdAt
            ? new Date(item.createdAt).toLocaleDateString("en-US", {
                year: "numeric",
                month: "short",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit",
              })
            : "Unknown date";

          const badgeClass = worth === "Treasure" ? "green" : "red";
          const iconClass =
            worth === "Treasure"
              ? "gem fa-solid fa-gem"
              : "trash fa-solid fa-trash";

          const div = document.createElement("div");
          div.className = "prompt-card";
          div.innerHTML = `
            <div class="prompt-header">
              <div class="left-info">
                <span class="badge ${badgeClass}">
                  <i class="${iconClass}"></i>
                  ${worth}
                </span>
                <span class="date">${created}</span>
              </div>
              <span class="badge blue">Score: ${score}/100</span>
            </div>
            <div class="prompt-title">${title.substring(0, 80)}${
            title.length > 80 ? "..." : ""
          }</div>
            <div class="prompt-excerpt">
              ${(
                item.whyTreasure || item.problem_it_solves || "No description available"
              ).substring(0, 150)}${
            (item.whyTreasure || item.problem_it_solves || "").length > 150 ? "..." : ""
          }
            </div>
            <div class="prompt-actions">
              <div class="action-buttons">
                <a href="#" class="view-btn" onclick="viewPrompt('${item._id}'); return false;">
                  <i class="fas fa-eye"></i> View Details
                </a>
                <a href="#" class="download-btn" onclick="downloadPrompt('${item._id}'); return false;">
                  <i class="fas fa-download"></i> Get Roadmap
                </a>
              </div>
              <div class="prompt-meta">
                <span class="words">
                  <i class="fas fa-file-text"></i> ${(item.prompt_desc || '').split(' ').length} words
                </span>
              </div>
            </div>
          `;
            console.log(item);
          
          // Add click handler for the entire card
          div.onclick = (e) => {
            // Don't trigger if clicking on action buttons
            if (e.target.closest('.action-buttons')) return;
            
            // Store the selected prompt data for the result page
            localStorage.setItem("selectedPromptId", item._id);
            
            // Create a result object similar to what the AI API returns
            const resultObject = {
              topic: item.prompt_desc || "Untitled",
              verdict: item.worthbuilding || "Unknown",
              Score: item.score || "N/A",
              audience: item.target_audience || "N/A",
              monthlyEarning: item.earning_potential || "N/A",
              realWorldProblem: item.problem_it_solves || "N/A",
              USP: item.usp || "N/A",
              monetizationStrategy: item.monetization_model || "N/A",
              mvpFeatureList: item.mvp_features || "N/A",
              TechStack: item.tech_stack
                ? `
                Frontend : ${item.tech_stack.frontend || "N/A"},
                Backend : ${item.tech_stack.backend || "N/A"},
                mobile App : ${item.tech_stack.mobile_app || "N/A"},
                database : ${item.tech_stack.database || "N/A"},
                ai : ${item.tech_stack.ai || "N/A"},
                auth : ${item.tech_stack.auth || "N/A"},
              `
                : "N/A",
              Timeline_to_first_revenue: item.timeline_to_first_revenue || [],
              roadmap: item.roadmap || [],
              whyTreasure: item.whyTreasure || "N/A",
            };

            localStorage.setItem("aiResult", JSON.stringify(resultObject));
            window.location.href = "/result.html";
          };

          historyList.appendChild(div);
        });

        // Update pagination
        updatePagination();
      }

      function updatePagination() {
        const pagination = document.getElementById("pagination");
        const itemsPerPage = 10;
        totalPages = Math.ceil(filteredPrompts.length / itemsPerPage);

        if (totalPages <= 1) {
          pagination.style.display = "none";
          return;
        }

        pagination.style.display = "flex";
        pagination.innerHTML = "";

        // Previous button
        const prevBtn = document.createElement("button");
        prevBtn.textContent = "Previous";
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => changePage(-1);
        pagination.appendChild(prevBtn);

        // Page numbers
        for (let i = 1; i <= Math.min(totalPages, 5); i++) {
          const pageBtn = document.createElement("button");
          pageBtn.textContent = i;
          pageBtn.className = i === currentPage ? "active" : "";
          pageBtn.onclick = () => goToPage(i);
          pagination.appendChild(pageBtn);
        }

        // Next button
        const nextBtn = document.createElement("button");
        nextBtn.textContent = "Next";
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => changePage(1);
        pagination.appendChild(nextBtn);
      }

      function changePage(direction) {
        const newPage = currentPage + direction;
        if (newPage >= 1 && newPage <= totalPages) {
          currentPage = newPage;
          displayPrompts();
        }
      }

      function goToPage(page) {
        currentPage = page;
        displayPrompts();
      }

      function viewPrompt(promptId) {
        const prompt = allPrompts.find(p => p._id === promptId);
        if (prompt) {
          localStorage.setItem("selectedPromptId", promptId);
          
          const resultObject = {
            topic: prompt.prompt_desc || "Untitled",
            verdict: prompt.worthbuilding || "Unknown",
            Score: prompt.score || "N/A",
            audience: prompt.target_audience || "N/A",
            monthlyEarning: prompt.earning_potential || "N/A",
            realWorldProblem: prompt.problem_it_solves || "N/A",
            USP: prompt.usp || "N/A",
            monetizationStrategy: prompt.monetization_model || "N/A",
            mvpFeatureList: prompt.mvp_features || "N/A",
            TechStack: prompt.tech_stack
              ? `Frontend: ${prompt.tech_stack.frontend || "N/A"}, Backend: ${prompt.tech_stack.backend || "N/A"}, Mobile: ${prompt.tech_stack.mobile_app || "N/A"}, Database: ${prompt.tech_stack.database || "N/A"}, AI: ${prompt.tech_stack.ai || "N/A"}, Auth: ${prompt.tech_stack.auth || "N/A"}`
              : "N/A",
            Timeline_to_first_revenue: prompt.timeline_to_first_revenue || [],
            roadmap: prompt.roadmap || [],
            whyTreasure: prompt.whyTreasure || "N/A",
          };

          localStorage.setItem("aiResult", JSON.stringify(resultObject));
          window.location.href = "/result.html";
        }
      }

      function downloadPrompt(promptId) {
        const prompt = allPrompts.find(p => p._id === promptId);
        if (prompt) {
          // Create PDF download functionality
          const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(prompt, null, 2));
          const downloadAnchorNode = document.createElement('a');
          downloadAnchorNode.setAttribute("href", dataStr);
          downloadAnchorNode.setAttribute("download", `${prompt.prompt_desc || 'prompt'}.json`);
          document.body.appendChild(downloadAnchorNode);
          downloadAnchorNode.click();
          downloadAnchorNode.remove();
        }
      }

      function setupEventListeners() {
        document
          .getElementById("filterType")
          .addEventListener("change", applyFiltersAndSort);
        document
          .getElementById("sortBy")
          .addEventListener("change", applyFiltersAndSort);
      }
    </script>
    
    <script>
      // Hamburger Menu Functionality - Same as result page
      const hamburgerMenu = document.getElementById('hamburgerMenu');
      const mobileNavMenu = document.getElementById('mobileNavMenu');
      const closeMenu = document.getElementById('closeMenu');
      const mobileOverlay = document.getElementById('mobileOverlay');
      
      function toggleMenu() {
        const isActive = mobileNavMenu.classList.contains('active');
        
        if (isActive) {
          // Close menu
          hamburgerMenu.classList.remove('active');
          mobileNavMenu.classList.remove('active');
          mobileOverlay.classList.remove('active');
          document.body.style.overflow = '';
        } else {
          // Open menu
          hamburgerMenu.classList.add('active');
          mobileNavMenu.classList.add('active');
          mobileOverlay.classList.add('active');
          document.body.style.overflow = 'hidden';
        }
      }
      
      hamburgerMenu.addEventListener('click', toggleMenu);
      closeMenu.addEventListener('click', toggleMenu);

      // Close menu when clicking on overlay
      mobileOverlay.addEventListener('click', toggleMenu);

      // Close menu when clicking on a nav item
      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          hamburgerMenu.classList.remove('active');
          mobileNavMenu.classList.remove('active');
          mobileOverlay.classList.remove('active');
          document.body.style.overflow = '';
        });
      });

      // Handle window resize
      window.addEventListener('resize', () => {
        if (window.innerWidth > 768) {
          hamburgerMenu.classList.remove('active');
          mobileNavMenu.classList.remove('active');
          mobileOverlay.classList.remove('active');
          document.body.style.overflow = '';
        }
      });

      // Authentication functions - Same as result page
      function checkAuth() {
        const user = JSON.parse(localStorage.getItem("user"));
        
        if (user && user.name) {
          const welcomeUser = document.getElementById('welcomeUser');
          const logout = document.getElementById('logout');
          const loginNav = document.getElementById('login-nav');
          
          if (welcomeUser) welcomeUser.textContent = `Welcome ${user.name}`;
          if (logout) logout.style.display = 'block';
          if (loginNav) loginNav.style.display = 'none';
        } else {
          const welcomeUser = document.getElementById('welcomeUser');
          const logout = document.getElementById('logout');
          const loginNav = document.getElementById('login-nav');
          
          if (welcomeUser) welcomeUser.textContent = 'Welcome Guest';
          if (logout) logout.style.display = 'none';
          if (loginNav) loginNav.style.display = 'block';
        }
      }

      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "/index.html";
      }

      // Initialize auth on page load
      document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
  </body>
</html>
