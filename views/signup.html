<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account - Prompt2Profit</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/signup.css">
</head>
<body>
  <div class="container">
    <form class="register-box" id="signup-form">
      <h1 class="brand">Prompt2Profit</h1>
      <h2 class="form-title">Create Account</h2>

      <label for="name">Full Name</label>
      <div class="input-box">
        <i class="fa-solid fa-user" style="color:#9CA3AF"></i>
        <input type="text" id="name" placeholder="Enter your full name" required />
      </div>

      <label for="email">Email Address</label>
      <div class="input-box">
        <i class="fa-solid fa-envelope" style="color:#9CA3AF"></i>
        <input type="email" id="email" placeholder="Enter your email" required />
      </div>

      <label for="password">Password</label>
      <div class="input-box">
        <i class="fa-solid fa-lock" style="color:#9CA3AF"></i>
        <input type="password" id="password" placeholder="Create a password" required/>
        <i class="fa-regular fa-eye eye-icon" style="color:#9CA3AF"></i>
      </div>
      <p class="password-hint">Password must be at least 8 characters long</p>

      <label for="confirm_password">Confirm Password</label>
      <div class="input-box">
        <i class="fa-solid fa-lock" style="color:#9CA3AF"></i>
        <input type="password" id="confirm_password" placeholder="Confirm your password" required />
      </div>

      <button type="submit" class="submit-btn">Create Account</button>

      <div class="divider"><span>Or continue with</span></div>
      <div class="social-buttons">
        <button type="button" class="social google"><i class="fa-brands fa-google" style="color: red"></i> Google</button>
        <button type="button" class="social github"><i class="fa-brands fa-github" style="color: black"></i> GitHub</button>
      </div>

      <p class="signin-text">Already have an account? <a href="#">Sign in</a></p>
    </form>
  </div>

  <script>
    document.querySelectorAll('.eye-icon').forEach(icon => {
      icon.addEventListener('click', () => {
        const input = icon.previousElementSibling;
        input.type = input.type === 'password' ? 'text' : 'password';
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
      });
    });

    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm_password = document.getElementById("confirm_password").value;

      if (password !== confirm_password) {
        return alert("Passwords do not match.");
      }

      try {
        const res = await fetch("/user/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name,
            email,
            password,
            confirm_password,
            role: "user" 
          }),
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data.user));
          alert(`Signup successful, Welcome ${data.user.name}`);
          window.location.href = "/login.html";
        } else {
          alert(data.message || "Signup failed.");
        }
      } catch (err) {
        console.error("Signup error:", err);
        alert("Server error. Please try again later.");
      }
    });
  </script>
</body>
</html>
